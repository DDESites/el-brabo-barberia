<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Ilustração das ferramentas do barbeiro: tesoura, navalha, pente e pincel com detalhes dourados">
  <title>El Brabo Barbería — ferramentas do ofício</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151109"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0CB7B"/>
      <stop offset="45%" stop-color="#E1AE45"/>
      <stop offset="100%" stop-color="#A87525"/>
    </linearGradient>
    <linearGradient id="aco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f4ee"/>
      <stop offset="100%" stop-color="#9c968a"/>
    </linearGradient>
    <linearGradient id="aco2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9e6de"/>
      <stop offset="55%" stop-color="#b7b1a4"/>
      <stop offset="100%" stop-color="#7d786d"/>
    </linearGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a22"/>
      <stop offset="100%" stop-color="#3c2812"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0%" stop-color="#E1AE45" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="640" fill="url(#bg)"/>
  <rect width="960" height="640" fill="url(#luz)"/>

  <!-- moldura fina -->
  <rect x="30" y="30" width="900" height="580" rx="8" fill="none" stroke="#A87525" stroke-width="1.6" opacity="0.6"/>

  <!-- tesoura -->
  <g transform="translate(230 320) rotate(-18)">
    <path d="M -14,-170 C -20,-120 -22,-60 -20,10 L 20,10 C 22,-60 20,-120 14,-170 C 8,-190 -8,-190 -14,-170 Z" fill="url(#aco2)"/>
    <path d="M -10,-150 C -14,-100 -16,-40 -15,0 L -3,0 C -4,-40 -4,-100 -4,-150 Z" fill="#f8f7f2" opacity="0.6"/>
    <circle cx="0" cy="34" r="15" fill="url(#ouro)"/>
    <circle cx="0" cy="34" r="6" fill="#151109"/>
    <path d="M -8,48 C -30,80 -46,110 -46,140 C -46,172 -26,192 0,192 C 26,192 46,172 46,140 C 46,110 30,80 8,48 Z" fill="url(#ouro)"/>
    <path d="M -8,64 C -22,90 -32,112 -32,138 C -32,160 -18,176 0,176 C 18,176 32,160 32,138 C 32,112 22,90 8,64 Z" fill="#151109"/>
    <path d="M 6,46 C 24,72 34,96 38,118 L 26,124 C 22,100 14,74 2,54 Z" fill="url(#ouro)"/>
  </g>

  <!-- navalha -->
  <g transform="translate(560 300) rotate(-8)">
    <path d="M -210,10 C -160,-30 -60,-46 40,-40 C 70,-38 86,-28 86,-14 C 86,-2 66,6 30,8 C -60,14 -160,34 -210,42 C -226,44 -230,16 -210,10 Z" fill="url(#aco2)"/>
    <path d="M -190,16 C -150,-8 -70,-24 30,-24 C 56,-24 70,-20 72,-14 C 40,-16 -60,-4 -150,20 Z" fill="#f8f7f2" opacity="0.55"/>
    <g fill="#A87525">
      <circle cx="-140" cy="16" r="4"/>
      <circle cx="-96" cy="8" r="4"/>
      <circle cx="-52" cy="2" r="4"/>
    </g>
    <!-- cabo -->
    <path d="M 86,-24 C 150,-26 210,-14 236,4 C 246,12 242,26 228,30 C 190,42 130,42 86,34 C 74,30 74,-18 86,-24 Z" fill="url(#madeira)"/>
    <path d="M 100,-14 C 150,-16 200,-6 224,6 C 190,0 140,-2 100,-4 Z" fill="#8a5f2c" opacity="0.7"/>
    <path d="M 86,-26 L 100,-26 L 100,36 L 86,36 Z" fill="url(#ouro)"/>
    <circle cx="206" cy="8" r="6" fill="url(#ouro)"/>
  </g>

  <!-- pente -->
  <g transform="translate(300 520) rotate(6)">
    <path d="M -150,-18 L 150,-18 C 160,-18 164,-12 164,-4 L 164,4 C 164,12 160,18 150,18 L -150,18 C -160,18 -164,12 -164,4 L -164,-4 C -164,-12 -160,-18 -150,-18 Z" fill="url(#ouro)"/>
    <g stroke="#3c2812" stroke-width="6">
      <path d="M -134,18 L -134,44 M -104,18 L -104,44 M -74,18 L -74,44 M -44,18 L -44,44 M -14,18 L -14,44 M 16,18 L 16,44 M 46,18 L 46,44 M 76,18 L 76,44 M 106,18 L 106,44 M 136,18 L 136,44"/>
    </g>
    <rect x="-150" y="-14" width="300" height="8" rx="4" fill="#f0cb7b" opacity="0.6"/>
  </g>

  <!-- pincel -->
  <g transform="translate(720 480) rotate(-24)">
    <path d="M -18,-90 C -18,-130 18,-130 18,-90 L 18,-60 L -18,-60 Z" fill="#d9d3c4"/>
    <g stroke="#b3ac9a" stroke-width="2">
      <path d="M -10,-124 L -10,-62 M 0,-128 L 0,-62 M 10,-124 L 10,-62"/>
    </g>
    <rect x="-24" y="-62" width="48" height="26" rx="6" fill="url(#ouro)"/>
    <rect x="-16" y="-36" width="32" height="90" rx="12" fill="url(#madeira)"/>
    <rect x="-16" y="30" width="32" height="10" rx="4" fill="url(#ouro)"/>
    <circle cx="0" cy="48" r="5" fill="#151109"/>
  </g>

  <!-- toalha enrolada -->
  <g transform="translate(480 130)">
    <rect x="-120" y="-30" width="240" height="58" rx="29" fill="#241f1a" stroke="#A87525" stroke-width="2"/>
    <ellipse cx="91" cy="-1" rx="29" ry="29" fill="#2e2822" stroke="#A87525" stroke-width="2"/>
    <ellipse cx="91" cy="-1" rx="15" ry="15" fill="#1a1613"/>
    <rect x="-120" y="-8" width="180" height="8" fill="#E1AE45" opacity="0.25"/>
  </g>

  <!-- estrelas decorativas -->
  <g fill="url(#ouro)" opacity="0.9">
    <g transform="translate(120 120) scale(0.7)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
    <g transform="translate(840 120) scale(0.7)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
    <g transform="translate(120 540) scale(0.7)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
    <g transform="translate(840 540) scale(0.7)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
  </g>
</svg>
