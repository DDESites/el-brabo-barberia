<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Ilustração do interior da El Brabo Barbería com cadeiras de barbeiro, espelhos iluminados a dourado e poste clássico">
  <title>El Brabo Barbería — o espaço</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171208"/>
      <stop offset="70%" stop-color="#0d0b08"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="espelho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2416"/>
      <stop offset="45%" stop-color="#16120c"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0CB7B"/>
      <stop offset="45%" stop-color="#E1AE45"/>
      <stop offset="100%" stop-color="#A87525"/>
    </linearGradient>
    <linearGradient id="couro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2320"/>
      <stop offset="100%" stop-color="#14100e"/>
    </linearGradient>
    <linearGradient id="aco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efece4"/>
      <stop offset="100%" stop-color="#8d887e"/>
    </linearGradient>
    <pattern id="listras" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#100d0b"/>
      <rect width="12" height="24" fill="#C9922F"/>
    </pattern>
    <radialGradient id="luz" cx="0.5" cy="0.28" r="0.7">
      <stop offset="0%" stop-color="#E1AE45" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="640" fill="url(#bg)"/>
  <rect width="960" height="640" fill="url(#luz)"/>

  <!-- parede -->
  <rect x="0" y="0" width="960" height="470" fill="#121009"/>
  <!-- friso dourado -->
  <rect x="0" y="466" width="960" height="6" fill="url(#ouro)"/>
  <!-- piso -->
  <rect x="0" y="472" width="960" height="168" fill="#0c0a08"/>
  <g stroke="#E1AE45" stroke-width="0.7" opacity="0.14">
    <path d="M 0,512 L 960,512 M 0,556 L 960,556 M 0,604 L 960,604"/>
    <path d="M 120,472 L 60,640 M 300,472 L 270,640 M 480,472 L 480,640 M 660,472 L 690,640 M 840,472 L 900,640"/>
  </g>

  <!-- espelhos com luz quente -->
  <g>
    <rect x="96" y="96" width="200" height="270" rx="14" fill="url(#espelho)" stroke="url(#ouro)" stroke-width="3"/>
    <rect x="106" y="106" width="180" height="250" rx="9" fill="none" stroke="#E1AE45" stroke-width="1" opacity="0.5"/>
    <path d="M 120,120 L 160,120 L 120,340 L 120,120 Z" fill="#E1AE45" opacity="0.05"/>
    <rect x="380" y="96" width="200" height="270" rx="14" fill="url(#espelho)" stroke="url(#ouro)" stroke-width="3"/>
    <rect x="390" y="106" width="180" height="250" rx="9" fill="none" stroke="#E1AE45" stroke-width="1" opacity="0.5"/>
    <path d="M 404,120 L 444,120 L 404,340 L 404,120 Z" fill="#E1AE45" opacity="0.05"/>
    <rect x="664" y="96" width="200" height="270" rx="14" fill="url(#espelho)" stroke="url(#ouro)" stroke-width="3"/>
    <rect x="674" y="106" width="180" height="250" rx="9" fill="none" stroke="#E1AE45" stroke-width="1" opacity="0.5"/>
    <path d="M 688,120 L 728,120 L 688,340 L 688,120 Z" fill="#E1AE45" opacity="0.05"/>
  </g>

  <!-- pendentes dourados -->
  <g stroke="#A87525" stroke-width="2">
    <path d="M 196,0 L 196,60 M 480,0 L 480,48 M 764,0 L 764,60"/>
  </g>
  <g fill="url(#ouro)">
    <path d="M 176,60 L 216,60 L 206,96 L 186,96 Z"/>
    <path d="M 460,48 L 500,48 L 490,84 L 470,84 Z"/>
    <path d="M 744,60 L 784,60 L 774,96 L 754,96 Z"/>
  </g>
  <g fill="#F0CB7B" opacity="0.75">
    <circle cx="196" cy="100" r="6"/>
    <circle cx="480" cy="88" r="6"/>
    <circle cx="764" cy="100" r="6"/>
  </g>

  <!-- bancada -->
  <rect x="76" y="366" width="808" height="22" rx="6" fill="#1d1812" stroke="#A87525" stroke-width="1.6"/>
  <rect x="86" y="388" width="788" height="66" rx="6" fill="#141009" stroke="#393735" stroke-width="1.4"/>

  <!-- produtos na bancada -->
  <g>
    <rect x="132" y="326" width="20" height="40" rx="5" fill="#241d12" stroke="#A87525" stroke-width="1.4"/>
    <rect x="136" y="316" width="12" height="12" rx="3" fill="#E1AE45"/>
    <rect x="166" y="336" width="16" height="30" rx="4" fill="#241d12" stroke="#A87525" stroke-width="1.4"/>
    <rect x="420" y="332" width="18" height="34" rx="5" fill="#241d12" stroke="#A87525" stroke-width="1.4"/>
    <rect x="424" y="322" width="10" height="12" rx="3" fill="#E1AE45"/>
    <rect x="742" y="330" width="18" height="36" rx="5" fill="#241d12" stroke="#A87525" stroke-width="1.4"/>
    <rect x="772" y="340" width="14" height="26" rx="4" fill="#241d12" stroke="#A87525" stroke-width="1.4"/>
  </g>

  <!-- cadeiras de barbeiro -->
  <g transform="translate(196 470)">
    <ellipse cx="0" cy="116" rx="86" ry="12" fill="#000" opacity="0.5"/>
    <path d="M -24,110 L -14,74 L 14,74 L 24,110 Z" fill="url(#aco)" opacity="0.8"/>
    <rect x="-36" y="104" width="72" height="9" rx="4" fill="#241f1b"/>
    <rect x="-52" y="-58" width="104" height="108" rx="20" fill="url(#couro)" stroke="url(#ouro)" stroke-width="2.2"/>
    <g stroke="#E1AE45" stroke-width="0.8" opacity="0.45" fill="none">
      <path d="M -52,-24 L -18,-58 M -52,12 L -18,-24 M -52,48 L -18,12 M 52,-24 L 18,-58 M 52,12 L 18,-24 M 52,48 L 18,12"/>
    </g>
    <rect x="-60" y="48" width="120" height="38" rx="14" fill="url(#couro)" stroke="url(#ouro)" stroke-width="2.2"/>
    <rect x="-84" y="38" width="19" height="48" rx="9" fill="#241f1b" stroke="#A87525" stroke-width="1.4"/>
    <rect x="65" y="38" width="19" height="48" rx="9" fill="#241f1b" stroke="#A87525" stroke-width="1.4"/>
  </g>
  <g transform="translate(480 470)">
    <ellipse cx="0" cy="116" rx="86" ry="12" fill="#000" opacity="0.5"/>
    <path d="M -24,110 L -14,74 L 14,74 L 24,110 Z" fill="url(#aco)" opacity="0.8"/>
    <rect x="-36" y="104" width="72" height="9" rx="4" fill="#241f1b"/>
    <rect x="-52" y="-58" width="104" height="108" rx="20" fill="url(#couro)" stroke="url(#ouro)" stroke-width="2.2"/>
    <g stroke="#E1AE45" stroke-width="0.8" opacity="0.45" fill="none">
      <path d="M -52,-24 L -18,-58 M -52,12 L -18,-24 M -52,48 L -18,12 M 52,-24 L 18,-58 M 52,12 L 18,-24 M 52,48 L 18,12"/>
    </g>
    <rect x="-60" y="48" width="120" height="38" rx="14" fill="url(#couro)" stroke="url(#ouro)" stroke-width="2.2"/>
    <rect x="-84" y="38" width="19" height="48" rx="9" fill="#241f1b" stroke="#A87525" stroke-width="1.4"/>
    <rect x="65" y="38" width="19" height="48" rx="9" fill="#241f1b" stroke="#A87525" stroke-width="1.4"/>
  </g>
  <g transform="translate(764 470)">
    <ellipse cx="0" cy="116" rx="86" ry="12" fill="#000" opacity="0.5"/>
    <path d="M -24,110 L -14,74 L 14,74 L 24,110 Z" fill="url(#aco)" opacity="0.8"/>
    <rect x="-36" y="104" width="72" height="9" rx="4" fill="#241f1b"/>
    <rect x="-52" y="-58" width="104" height="108" rx="20" fill="url(#couro)" stroke="url(#ouro)" stroke-width="2.2"/>
    <g stroke="#E1AE45" stroke-width="0.8" opacity="0.45" fill="none">
      <path d="M -52,-24 L -18,-58 M -52,12 L -18,-24 M -52,48 L -18,12 M 52,-24 L 18,-58 M 52,12 L 18,-24 M 52,48 L 18,12"/>
    </g>
    <rect x="-60" y="48" width="120" height="38" rx="14" fill="url(#couro)" stroke="url(#ouro)" stroke-width="2.2"/>
    <rect x="-84" y="38" width="19" height="48" rx="9" fill="#241f1b" stroke="#A87525" stroke-width="1.4"/>
    <rect x="65" y="38" width="19" height="48" rx="9" fill="#241f1b" stroke="#A87525" stroke-width="1.4"/>
  </g>

  <!-- poste de barbeiro -->
  <g transform="translate(52 300)">
    <rect x="-17" y="-90" width="34" height="260" rx="17" fill="url(#listras)" stroke="url(#ouro)" stroke-width="3"/>
    <circle cx="0" cy="-102" r="13" fill="url(#ouro)"/>
    <circle cx="0" cy="182" r="13" fill="url(#ouro)"/>
  </g>
</svg>
