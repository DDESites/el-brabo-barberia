<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustração de barba sendo finalizada na navalha com toalha quente">
  <title>Barba na navalha com toalha quente</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151109"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0CB7B"/>
      <stop offset="45%" stop-color="#E1AE45"/>
      <stop offset="100%" stop-color="#A87525"/>
    </linearGradient>
    <linearGradient id="aco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9e6de"/>
      <stop offset="55%" stop-color="#b7b1a4"/>
      <stop offset="100%" stop-color="#7d786d"/>
    </linearGradient>
    <linearGradient id="couro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2320"/>
      <stop offset="100%" stop-color="#14100e"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#E1AE45" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#luz)"/>
  <rect x="22" y="22" width="596" height="436" rx="8" fill="none" stroke="#A87525" stroke-width="1.6" opacity="0.55"/>

  <!-- cliente reclinado -->
  <g transform="translate(300 280) rotate(-8)">
    <!-- cadeira -->
    <path d="M -230,140 C -220,80 -160,52 -80,48 L 90,48 C 150,56 180,96 184,140 Z" fill="url(#couro)" stroke="#A87525" stroke-width="2"/>
    <!-- capa -->
    <path d="M -150,60 C -120,-10 -40,-40 40,-24 C 90,-14 120,10 130,60 Z" fill="#1c1712" stroke="#A87525" stroke-width="1.6"/>
    <!-- pescoço -->
    <path d="M -30,-40 L 46,-52 L 56,-8 L -18,4 Z" fill="#3a2f26"/>
    <!-- cabeça -->
    <path d="M -40,-118 C 6,-146 70,-128 82,-84 C 92,-46 74,-14 38,-6 C 4,2 -30,-16 -42,-52 C -52,-82 -54,-108 -40,-118 Z" fill="#4a3c30"/>
    <!-- cabelo -->
    <path d="M -44,-110 C -8,-144 56,-132 78,-92 C 60,-116 22,-126 -14,-118 C -32,-114 -42,-104 -46,-92 Z" fill="#241d16"/>
    <!-- barba cheia -->
    <path d="M -36,-64 C -30,-24 0,4 34,-2 C 62,-8 78,-32 76,-62 C 66,-40 42,-28 14,-26 C -10,-24 -28,-40 -36,-64 Z" fill="#241d16"/>
    <path d="M -30,-52 C -20,-22 6,-6 32,-12" stroke="#171209" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- fechadinho -->
    <path d="M -30,-84 C -44,-80 -48,-62 -38,-52" stroke="#241d16" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- olho fechado -->
    <path d="M 22,-72 C 32,-78 44,-78 52,-72" stroke="#171209" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- toalha quente no queixo -->
    <path d="M -44,-40 C -14,-16 30,-14 62,-36 C 74,-20 72,4 52,14 C 16,32 -26,26 -48,4 C -60,-10 -58,-30 -44,-40 Z" fill="#efece4"/>
    <path d="M -40,-28 C -12,-8 26,-8 56,-26" stroke="#c9c4b8" stroke-width="4" fill="none"/>
    <!-- vapor -->
    <g stroke="#E1AE45" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M -70,-90 C -80,-110 -60,-120 -70,-142"/>
      <path d="M -30,-128 C -40,-150 -20,-160 -30,-182"/>
      <path d="M 90,-120 C 80,-142 100,-152 90,-174"/>
    </g>
  </g>

  <!-- navalha do barbeiro -->
  <g transform="translate(478 172) rotate(38)">
    <path d="M -110,6 C -74,-16 -30,-24 16,-20 C 34,-18 42,-12 42,-4 C 42,2 32,6 14,8 C -30,12 -76,22 -110,26 C -120,28 -122,10 -110,6 Z" fill="url(#aco)"/>
    <g fill="#A87525">
      <circle cx="-76" cy="10" r="3"/>
      <circle cx="-52" cy="5" r="3"/>
      <circle cx="-28" cy="1" r="3"/>
    </g>
    <path d="M 42,-12 C 78,-14 116,-6 132,4 C 138,8 136,16 128,18 C 104,24 70,24 42,20 C 36,18 36,-10 42,-12 Z" fill="#3c2812"/>
    <path d="M 42,-12 L 50,-12 L 50,22 L 42,22 Z" fill="url(#ouro)"/>
  </g>

  <!-- mão com lâmina (silhueta simples) -->
  <g transform="translate(520 210)">
    <path d="M 0,0 C 26,4 44,20 46,42 C 48,62 34,76 14,76 C -6,76 -22,62 -24,42 C -26,22 -18,4 0,0 Z" fill="#3a2f26"/>
  </g>

  <!-- estrelas -->
  <g fill="url(#ouro)">
    <g transform="translate(112 100) scale(0.7)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
    <g transform="translate(80 140) scale(0.5)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
  </g>
</svg>
