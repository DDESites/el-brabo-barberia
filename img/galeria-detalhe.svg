<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustração de detalhe: navalha, pente e produtos de barba sobre superfície escura com luz dourada">
  <title>Detalhe das ferramentas</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151109"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0CB7B"/>
      <stop offset="45%" stop-color="#E1AE45"/>
      <stop offset="100%" stop-color="#A87525"/>
    </linearGradient>
    <linearGradient id="aco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9e6de"/>
      <stop offset="55%" stop-color="#b7b1a4"/>
      <stop offset="100%" stop-color="#7d786d"/>
    </linearGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a22"/>
      <stop offset="100%" stop-color="#3c2812"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#E1AE45" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#luz)"/>
  <rect x="22" y="22" width="596" height="436" rx="8" fill="none" stroke="#A87525" stroke-width="1.6" opacity="0.55"/>

  <!-- superfície -->
  <path d="M 22,330 L 618,330 L 618,458 L 22,458 Z" fill="#100d0a"/>
  <rect x="22" y="326" width="596" height="6" fill="url(#ouro)"/>
  <g stroke="#E1AE45" stroke-width="0.7" opacity="0.12">
    <path d="M 60,330 L 40,458 M 180,330 L 170,458 M 320,330 L 320,458 M 460,330 L 470,458 M 580,330 L 600,458"/>
  </g>

  <!-- navalha aberta -->
  <g transform="translate(200 250) rotate(-8)">
    <path d="M -130,8 C -88,-16 -30,-26 30,-22 C 52,-20 62,-12 62,-4 C 62,2 48,8 24,10 C -30,16 -92,30 -130,34 C -144,36 -146,12 -130,8 Z" fill="url(#aco)"/>
    <path d="M -112,14 C -78,-4 -28,-14 24,-14 C 42,-14 52,-10 54,-6 C 24,-8 -44,2 -112,22 Z" fill="#f8f7f2" opacity="0.5"/>
    <g fill="#A87525">
      <circle cx="-92" cy="14" r="3.4"/>
      <circle cx="-60" cy="8" r="3.4"/>
      <circle cx="-28" cy="3" r="3.4"/>
    </g>
    <path d="M 62,-14 C 108,-16 158,-6 178,6 C 186,11 184,20 174,22 C 144,28 100,28 62,24 C 54,22 54,-12 62,-14 Z" fill="url(#madeira)"/>
    <path d="M 72,-6 C 112,-8 152,-1 170,7 C 144,3 104,1 72,1 Z" fill="#8a5f2c" opacity="0.7"/>
    <rect x="62" y="-15" width="11" height="42" fill="url(#ouro)"/>
    <circle cx="156" cy="10" r="5" fill="url(#ouro)"/>
  </g>

  <!-- pente -->
  <g transform="translate(400 372) rotate(5)">
    <rect x="-110" y="-14" width="220" height="26" rx="12" fill="url(#ouro)"/>
    <g stroke="#3c2812" stroke-width="5">
      <path d="M -92,12 L -92,34 M -68,12 L -68,34 M -44,12 L -44,34 M -20,12 L -20,34 M 4,12 L 4,34 M 28,12 L 28,34 M 52,12 L 52,34 M 76,12 L 76,34 M 96,12 L 96,34"/>
    </g>
    <rect x="-110" y="-11" width="220" height="7" rx="3" fill="#f0cb7b" opacity="0.6"/>
  </g>

  <!-- frasco de óleo para barba -->
  <g transform="translate(508 246)">
    <rect x="-30" y="-40" width="60" height="86" rx="12" fill="#241d12" stroke="#A87525" stroke-width="2"/>
    <rect x="-12" y="-58" width="24" height="20" rx="5" fill="url(#ouro)"/>
    <rect x="-6" y="-70" width="12" height="14" rx="4" fill="#3c2812"/>
    <rect x="-20" y="-16" width="40" height="40" rx="6" fill="#E1AE45" opacity="0.22"/>
    <path d="M -12,4 C -6,-4 6,-4 12,4 C 6,12 -6,12 -12,4 Z" fill="#E1AE45" opacity="0.6"/>
  </g>

  <!-- toalha enrolada -->
  <g transform="translate(112 400)">
    <rect x="-70" y="-22" width="140" height="42" rx="21" fill="#241f1a" stroke="#A87525" stroke-width="2"/>
    <ellipse cx="49" cy="-1" rx="21" ry="21" fill="#2e2822" stroke="#A87525" stroke-width="2"/>
    <ellipse cx="49" cy="-1" rx="10" ry="10" fill="#1a1613"/>
  </g>

  <!-- estrelas -->
  <g fill="url(#ouro)">
    <g transform="translate(96 96) scale(0.6)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
    <g transform="translate(130 130) scale(0.45)"><path d="M 0,-11 L 3.2,-3.4 L 11,-3.4 L 4.6,1.3 L 6.8,8.9 L 0,4.4 L -6.8,8.9 L -4.6,1.3 L -11,-3.4 L -3.2,-3.4 Z"/></g>
  </g>
</svg>
